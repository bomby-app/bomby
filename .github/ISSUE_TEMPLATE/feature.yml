name: Feature request
description: An idea for Bomby. Wait for it to be marked accepted before building it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Bomby to do
    validations:
      required: true
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself, once it's accepted.
