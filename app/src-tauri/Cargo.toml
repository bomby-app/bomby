[package]
name = "bomby"
version = "0.1.0"
description = "Bomby, talk to your agents: the desktop app"
authors = ["Ahmed Aburady"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bomby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2"
thiserror = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
livekit-api = { version = "0.10", default-features = false, features = ["access-token"] }
livekit-protocol = "0.8.2"
tauri-plugin-clipboard-manager = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Stopping the agent worker and its children as a process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
