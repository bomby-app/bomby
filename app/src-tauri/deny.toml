# cargo-deny for the Rust core (`just app deny`): licenses we can ship under MIT, known
# advisories, and crates only from crates.io. Releases are Apple Silicon only, so only that
# target's dependency graph counts (GTK, Windows and Android crates never ship).

[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
# RustSec advisories (vulnerable, unmaintained, unsound) and yanked versions fail the check.
# Ignore one only with its id and why, after reading it.
ignore = []

[licenses]
# Permissive licenses, plus MPL-2.0 (cssparser and selectors, through Tauri), whose
# file-level copyleft is met by their source on crates.io.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri pulls in several versions of some crates; that's for upstream to settle.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
