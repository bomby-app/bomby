[project]
name = "bomby-agent"
version = "0.3.3"
description = "Bomby's voice agent: LiveKit with Gemini 3.8 Live, OpenAI GPT-Live or Rime Prism, running agents (Claude Code first) over ACP in the background"
authors = [
    { name = "Ahmed Aburady", email = "accounts@aburady.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "google-genai>=2.34.0",
    "livekit-agents[mcp]>=1.8.11",
    "livekit-plugins-google>=1.8.11",
    "livekit-plugins-openai>=1.8.11",
    "livekit-plugins-rime[realtime]>=1.8.11",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "zep-cloud>=4.0.1",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest>=9.2.0",
    "ruff==0.17.2",
    "types-pyyaml==6.0.12.20261030",
]
freeze = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
# pyright's defaults, plus PyInstaller's work and output folders (`just agent freeze`).
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]
# The ACP SDK's Client and Agent interfaces take and return `Any` (`**kwargs: Any`,
# extension params), so implementing them can't avoid it. Everything else stays strict.
reportAny = false
reportExplicitAny = false
