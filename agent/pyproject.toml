[project]
name = "bomby-agent"
version = "0.1.0"
description = "Bomby's voice agent: LiveKit + Gemini 3.8 Live, running agents (Claude Code first) over ACP in the background"
authors = [
    { name = "Ahmed Aburady", email = "accounts@aburady.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "google-genai>=2.34.0",
    "livekit-agents>=1.8.10",
    "livekit-plugins-google>=1.8.10",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "zep-cloud>=4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
freeze = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
# pyright's defaults, plus PyInstaller's work and output folders (`just agent freeze`).
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]
# The ACP SDK's Client and Agent interfaces take and return `Any` (`**kwargs: Any`,
# extension params), so implementing them can't avoid it. Everything else stays strict.
reportAny = false
reportExplicitAny = false
